# hp-x2-612-g2-camera: make sure the TPS68470 cell drivers are loaded before the
# PMIC driver probes, so the clock/regulator/GPIO cells bind synchronously when
# intel_skl_int3472_tps68470 creates them - i.e. before the OV8858 sensor device
# (which ACPI-_DEPends on the PMIC) is enumerated.
# Without this, at boot udev may load ov8858 before clk_tps68470 has registered
# its clkdev lookup; devm_v4l2_sensor_clk_get() then silently falls back to a
# fake fixed 19.2 MHz clock instead of deferring the probe.
softdep intel_skl_int3472_tps68470 pre: clk_tps68470 tps68470_regulator gpio_tps68470
softdep ov8858 pre: clk_tps68470 tps68470_regulator gpio_tps68470

# hp-x2-612-g2-camera: make sure the TPS68470 cell drivers are loaded before the
# PMIC driver probes, so the clock/regulator/GPIO cells bind synchronously when
# intel_skl_int3472_tps68470 creates them - i.e. before the sensor devices
# (OV8858 rear, IMX241 front; both ACPI-_DEPend on the PMIC) are enumerated.
# Without this, at boot udev may load a sensor driver before clk_tps68470 has
# registered its clkdev lookup; ov8858's devm_v4l2_sensor_clk_get() then
# silently falls back to a fake fixed 19.2 MHz clock instead of deferring the
# probe. Installed to /usr/lib/modprobe.d/ by packaging/arch.
softdep intel_skl_int3472_tps68470 pre: clk_tps68470 tps68470_regulator gpio_tps68470
softdep ov8858 pre: clk_tps68470 tps68470_regulator gpio_tps68470
softdep imx241 pre: clk_tps68470 tps68470_regulator gpio_tps68470

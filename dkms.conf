# DKMS configuration for hp-x2-612-g2-camera.
#
# Design: DKMS builds from a VENDORED source tree, never from the network.
#
#   `make dist` (also run by packaging/arch/PKGBUILD) fetches the pristine upstream
#   driver files for one kernel tag (scripts/fetch-sources.sh), applies
#   patches/*.patch, and copies the result into <tree>/vendor together with this
#   file, the Makefile and Kbuild. The copy installed under
#   /usr/src/hp-x2-612-g2-camera-<version>/ is therefore self-contained and builds
#   offline (e.g. from the pacman hook during a kernel upgrade, or at boot).
#
#   Why not fetch+patch in PRE_BUILD? DKMS runs unattended inside pacman
#   transactions/initramfs hooks where there may be no network, and a failed
#   fetch or a patch that no longer applies would surface as an opaque DKMS
#   failure at upgrade time. Vendoring moves all fallible steps to packaging time,
#   where a human sees them.
#
#   Limitation: the vendored drivers are the upstream files of ONE tag (e.g.
#   v7.2.9) plus our patches. They are compiled against whatever kernel DKMS is
#   building for. Within the same x.y stable series that is normally fine (driver
#   APIs do not change), but if a stable update changes these drivers upstream,
#   the DKMS modules silently keep the vendored (older) copy of them. For a new
#   x.y series the internal APIs may differ, so BUILD_EXCLUSIVE_KERNEL restricts
#   DKMS to the vendored series: on e.g. 7.3 DKMS skips the build and the stock
#   in-tree modules are used (camera unsupported, but nothing breaks).
#   After such a kernel upgrade: `make dist KVER=<new release>` / rebuild the
#   package (re-vendor), checking that patches still apply.
#
# `make dist` rewrites PACKAGE_VERSION and BUILD_EXCLUSIVE_KERNEL below; the
# values in the repository copy correspond to the v7.2.9 baseline.

PACKAGE_NAME="hp-x2-612-g2-camera"
PACKAGE_VERSION="7.2.9"

BUILD_EXCLUSIVE_KERNEL="^7\.2\."
BUILD_EXCLUSIVE_ARCH="x86_64"

# The Makefile detects ./vendor and only compiles (no prepare step).
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} modules"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"

# Module names must match the in-tree ones so these override them.
# /updates is searched before the in-tree modules (Arch depmod.d/search.conf:
# "search updates extramodules built-in").
BUILT_MODULE_NAME[0]="intel_skl_int3472_tps68470"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="ipu-bridge"
BUILT_MODULE_LOCATION[1]="."
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="ov8858"
BUILT_MODULE_LOCATION[2]="."
DEST_MODULE_LOCATION[2]="/updates/dkms"

# New driver (patches/0005), no in-tree counterpart. With patches/0006
# ipu-bridge builds the INT347F graph and imx241 binds at boot; without it
# imx241 only defers its probe (it claims nothing before the graph exists).
BUILT_MODULE_NAME[3]="imx241"
BUILT_MODULE_LOCATION[3]="."
DEST_MODULE_LOCATION[3]="/updates/dkms"

AUTOINSTALL="yes"
